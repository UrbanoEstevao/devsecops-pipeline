# Policy used for the intentionally vulnerable demo app in this repo.
# Same thresholds as the real policy, but in `warn` mode so the showcase
# pipeline stays green while still reporting everything it caught.
# Flip to `enforce` to watch the gate block the build.
mode: enforce

max_findings:
  critical: 0
  high: 0
  medium: -1
  low: -1
  info: -1

severity_override:
  Gitleaks: critical

exceptions: []
