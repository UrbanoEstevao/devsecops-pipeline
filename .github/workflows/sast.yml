name: SAST (Semgrep)

on:
  workflow_call:
    inputs:
      path:
        description: Directory to scan
        type: string
        default: "."
      configs:
        description: Space-separated Semgrep rulesets
        type: string
        default: "p/default p/owasp-top-ten p/secrets"
      semgrep-version:
        type: string
        default: "1.185.0"
      upload-to-code-scanning:
        description: Requires public repo or GitHub Advanced Security
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for diff-aware (baseline) scans on PRs
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"

      - name: Scan
        env:
          # Inputs go through env vars, never interpolated into the script (script-injection safe)
          SCAN_PATH: ${{ inputs.path }}
          CONFIGS: ${{ inputs.configs }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SEMGREP_SEND_METRICS: "off"
        run: |
          mkdir -p reports
          args=()
          for c in $CONFIGS; do args+=(--config "$c"); done
          # On PRs only report findings introduced by the PR (fast, low noise).
          if [ -n "$BASE_SHA" ]; then
            echo "Diff-aware scan against base $BASE_SHA"
            args+=(--baseline-commit "$BASE_SHA")
          fi
          semgrep scan "${args[@]}" --sarif --output reports/semgrep.sarif \
            --metrics=off --timeout 60 "$SCAN_PATH"

      - name: Upload to GitHub code scanning
        if: always() && inputs.upload-to-code-scanning && hashFiles('reports/semgrep.sarif') != ''
        continue-on-error: true # fork PRs / private repos without GHAS
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/semgrep.sarif
          category: sast-semgrep

      - name: Store report for the gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-semgrep
          path: reports/semgrep.sarif
          if-no-files-found: warn
          retention-days: 14
