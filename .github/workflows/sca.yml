name: SCA (Trivy + Dependency Review)

on:
  workflow_call:
    inputs:
      path:
        description: Directory with manifests/lockfiles to scan
        type: string
        default: "."
      trivy-version:
        type: string
        default: "0.76.2"
      trivy-sha256:
        description: SHA-256 of trivy_<version>_Linux-64bit.tar.gz (pinned, verified before use)
        type: string
        default: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      fail-on-severity:
        description: Dependency Review blocks PRs that ADD a dependency at/above this severity
        type: string
        default: "high"
      upload-to-code-scanning:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Trivy (dependencies + IaC + SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (checksum-verified)
        env:
          V: ${{ inputs.trivy-version }}
          SHA: ${{ inputs.trivy-sha256 }}
        run: |
          f="trivy_${V}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${V}/${f}"
          echo "${SHA}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy && sudo mv trivy /usr/local/bin/ && trivy --version

      - name: Cache vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan dependencies and IaC
        env:
          SCAN_PATH: ${{ inputs.path }}
        run: |
          mkdir -p reports
          trivy fs --scanners vuln,misconfig --format sarif \
            --output reports/trivy-fs.sarif "$SCAN_PATH"
          # Human-readable table in the log too
          trivy fs --scanners vuln --severity HIGH,CRITICAL "$SCAN_PATH"

      - name: Generate SBOM (CycloneDX)
        env:
          SCAN_PATH: ${{ inputs.path }}
        run: trivy fs --format cyclonedx --output reports/sbom.cdx.json "$SCAN_PATH"

      - name: Upload to GitHub code scanning
        if: always() && inputs.upload-to-code-scanning && hashFiles('reports/trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/trivy-fs.sarif
          category: sca-trivy

      - name: Store report for the gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-fs
          path: reports/trivy-fs.sarif
          retention-days: 14

      - name: Store SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: reports/sbom.cdx.json
          retention-days: 90

  dependency-review:
    name: Dependency Review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: on-failure
