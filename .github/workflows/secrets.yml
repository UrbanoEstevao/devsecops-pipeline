name: Secret scanning (Gitleaks)

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: SHA-256 of gitleaks_<version>_linux_x64.tar.gz
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      upload-to-code-scanning:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full git history, not just HEAD
          persist-credentials: false

      - name: Install Gitleaks (checksum-verified)
        env:
          V: ${{ inputs.gitleaks-version }}
          SHA: ${{ inputs.gitleaks-sha256 }}
        run: |
          f="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${f}"
          echo "${SHA}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo mv gitleaks /usr/local/bin/ && gitleaks version

      - name: Scan git history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p reports
          opts=()
          # On PRs scan only the PR's commits; elsewhere scan everything.
          if [ -n "$BASE_SHA" ]; then opts+=(--log-opts="${BASE_SHA}..${HEAD_SHA}"); fi
          gitleaks git . "${opts[@]}" --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path reports/gitleaks.sarif

      - name: Upload to GitHub code scanning
        if: always() && inputs.upload-to-code-scanning && hashFiles('reports/gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/gitleaks.sarif
          category: secrets-gitleaks

      - name: Store report for the gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gitleaks
          path: reports/gitleaks.sarif
          retention-days: 14
